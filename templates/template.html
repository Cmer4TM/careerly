<!doctype html>
<html lang="en" data-bs-theme="light">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <title>{% block title %}{% endblock %}</title>
</head>

<body class="d-flex flex-column m-auto gap-12 px-5">
    <header class="sticky-top">
        <nav class="navbar gap-3 m-auto">
            <a class="navbar-brand fst-italic fs-lg" href="{{ url_for('index') }}">Careerly</a>

            <div id="nav-links" class="btn-group">
                <a class="{%if request.endpoint=='index'%}btn-solid{%else%}btn-outline{%endif%} theme-inverse"
                    href="{{ url_for('index') }}">
                    <i class="bi bi-card-checklist"></i>
                    <span class="nav-option-text">&nbsp;Tracker</span>
                </a>

                <a class="{%if request.endpoint=='browse'%}btn-solid{%else%}btn-outline{%endif%} theme-inverse">
                    <i class="bi bi-binoculars"></i>
                    <span class="nav-option-text">&nbsp;Browse</span>
                </a>

                <a class="{%if request.endpoint=='interviews'%}btn-solid{%else%}btn-outline{%endif%} theme-inverse">
                    <i class="bi bi-person-video3"></i>
                    <span class="nav-option-text">&nbsp;Interviews</span>
                </a>
            </div>

            {% if true %}
            <button class="btn-solid btn-styled theme-inverse" data-bs-toggle="menu" aria-expanded="false">
                <i class="bi bi-person-fill"></i>
                Danyil
            </button>
            <div class="menu">
                <a class="menu-item" href="#">Profile</a>
                <a class="menu-item" href="#">Sign Out</a>
            </div>
            {% else %}
            <ul class="nav nav-underline">
                <a class="nav-link bg-white">Login</a>
                <a class="nav-link bg-white">Register</a>
            </ul>
            {% endif %}
        </nav>
    </header>

    <main class="d-flex flex-column flex-grow-1">{% block main %}{% endblock %}</main>

    <footer class="d-flex flex-column gap-12 mb-5 text-center">
        <hr />
        <div id="socials" class="d-flex m-auto gap-5">
            <a class="bi bi-github" target="_blank" href="https://github.com/Cmer4TM/careerly"></a>
            <a class="bi bi-trello" target="_blank" href="https://careerlyup.atlassian.net"></a>
        </div>
        <div class="d-flex flex-column sm:flex-row justify-content-center gap-5 md:gap-12">
            <i class="bi bi-linkedin">
                <a href="https://www.linkedin.com/in/danyil-sytnyk-b30476294" target="_blank">
                    Danyil Sytnyk
                </a>
            </i>
            <i class="bi bi-linkedin">
                <a href="https://www.linkedin.com/in/alina-sudakevych" target="_blank">
                    Alina Sudakevych
                </a>
            </i>
            <i class="bi bi-linkedin">
                <a href="https://www.linkedin.com/in/lokugamage" target="_blank">
                    Vinuth Lokugamage
                </a>
            </i>
            <i class="bi bi-linkedin">
                <a href="https://www.linkedin.com/in/cynthia-vrubel-6bb540295" target="_blank">
                    Cynthia Vrubel
                </a>
            </i>
        </div>
        <h6>Copyright &copy; 2026 | Careerly | All Rights Reserved</h6>
    </footer>
</body>

</html>
